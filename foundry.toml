[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Mezo is EVM-compatible; shanghai keeps PUSH0 available without assuming
# Cancun opcodes (TSTORE/MCOPY) are supported by the chain.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
